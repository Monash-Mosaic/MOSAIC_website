<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <filter id="camouflage" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.12" numOctaves="3" seed="12" stitchTiles="stitch" result="noise" />
    <feColorMatrix in="noise" type="saturate" values="0" result="grayscale" />
    <feComponentTransfer in="grayscale">
      <feFuncR type="discrete" tableValues="0.92 0.99" />
      <feFuncG type="discrete" tableValues="0.92 0.99" />
      <feFuncB type="discrete" tableValues="0.92 0.99" />
      <feFuncA type="table" tableValues="1 1" />
    </feComponentTransfer>
  </filter>
  <rect width="360" height="360" fill="#f5f5f5" filter="url(#camouflage)" />
</svg>