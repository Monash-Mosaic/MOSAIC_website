name: Deploy to Cloudflare (Production)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional release tag to deploy (e.g., v1.2.3). If empty, deploy latest stable (non-prerelease) release.'
        required: false
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy_production:
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read

    steps:
      - name: Resolve release tag
        id: version
        uses: actions/github-script@v8
        with:
          script: |
            const requestedTag = `${{ inputs.tag }}`.trim();
            const { owner, repo } = context.repo;
            let release;

            if (requestedTag) {
              const byTag = await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag: requestedTag,
              });
              release = byTag.data;
            } else {
              const { data: releases } = await github.rest.repos.listReleases({
                owner,
                repo,
                per_page: 100,
              });
              release = releases.find((r) => !r.draft && !r.prerelease);
              if (!release) {
                core.setFailed('No stable (non-prerelease) release found.');
                return;
              }
            }

            const resolvedTag = release.tag_name;
            core.info(`Deploying release tag: ${resolvedTag}`);
            core.setOutput('tag', resolvedTag);

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          lfs: true
          ref: ${{ steps.version.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Restore node_modules cache
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            next-${{ runner.os }}-

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: |
          if [ "${{ github.actor }}" = "dependabot[bot]" ]; then
            npm install --package-lock-only
          fi
          npm ci

      - name: Deploy to Cloudflare (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_GIT_TAG: ${{ steps.version.outputs.tag }}
          NEXT_PUBLIC_GA_ID: ${{ env.NEXT_PUBLIC_GA_ID }}
          NEXT_PUBLIC_CF_BEACON_TOKEN: ${{ env.NEXT_PUBLIC_CF_BEACON_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          # upload the runtime creds to cloudflare secrets
          npx wrangler secrets put GOOGLE_CLIENT_ID "$GOOGLE_CLIENT_ID"
          npx wrangler secrets put GOOGLE_CLIENT_SECRET "$GOOGLE_CLIENT_SECRET"
          npx wrangler secrets put GOOGLE_REFRESH_TOKEN "$GOOGLE_REFRESH_TOKEN"

          # Without pipefail the pipeline reports tee's exit code, so a failed
          # wrangler upload would be swallowed and the job would pass.
          set -o pipefail
          LOG=$(npm run upload -- --tag "$NEXT_PUBLIC_GIT_TAG" 2>&1 | tee /dev/stderr)
          VERSION_ID=$(echo "$LOG" | grep -oE 'Worker Version ID: [0-9a-f-]+' | awk '{print $4}')
          if [ -z "$VERSION_ID" ]; then
            echo "Failed to parse Worker Version ID from upload output."
            exit 1
          fi
          npx wrangler versions deploy -y "$VERSION_ID"

      - name: Purge Cloudflare CDN cache
        if: ${{ vars.CLOUDFLARE_ZONE_ID != '' }}
        uses: nathanvaughn/actions-cloudflare-purge@v4.0.0
        with:
          cf_zone: ${{ vars.CLOUDFLARE_ZONE_ID }}
          cf_auth: ${{ secrets.CLOUDFLARE_API_TOKEN }}
