name: Dependabot Auto Merge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Enable auto-merge for Dependabot PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          PR_NUMBER=$(gh api "repos/${REPOSITORY}/commits/${HEAD_SHA}/pulls" --jq '.[0].number')
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "No pull request found for ${HEAD_SHA}; skipping."
            exit 0
          fi

          AUTHOR=$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.user.login')
          if [ "$AUTHOR" != "dependabot[bot]" ]; then
            echo "PR #${PR_NUMBER} is not from Dependabot; skipping."
            exit 0
          fi

          gh pr merge "$PR_NUMBER" --repo "$REPOSITORY" --auto --squash
