name: Restore Next.js cache
description: Restore the Next.js build cache.

runs:
  using: composite
  steps:
    - name: Restore Next.js cache
      uses: actions/cache@v4
      with:
        path: .next/cache
        key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          next-${{ runner.os }}-
